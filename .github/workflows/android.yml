name: Android

on:
  push:
    branches: [main]
    paths: ['apps/android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['apps/android/**', '.github/workflows/android.yml']

# Read-only by default; only the publish job below gets write access.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      sign: ${{ steps.gate.outputs.sign }}
      version-code: ${{ steps.version.outputs.code }}
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      # versionCode = 1000 + run number. run_number restarts at 1 if this workflow
      # is renamed or recreated, and Android refuses to install a lower versionCode,
      # so the offset keeps new builds above old ones. Bump the offset past the last
      # published versionCode if the workflow is ever renamed.
      - name: Compute versionCode
        id: version
        run: |
          code=$((1000 + GITHUB_RUN_NUMBER))
          echo "HOME_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      # `secrets` cannot be used in `if:`, so decide here (push to main with all
      # four signing secrets present) and expose the result as an output.
      # The secrets are only visible to this step, the restore step and the build.
      - name: Check signing is possible
        id: gate
        env:
          IS_PUSH: ${{ github.event_name == 'push' }}
          KEYSTORE: ${{ secrets.HOME_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.HOME_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HOME_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HOME_KEY_PASSWORD }}
        run: |
          if [ "$IS_PUSH" = "true" ] && [ -n "$KEYSTORE" ] && [ -n "$STORE_PASSWORD" ] \
            && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
          else
            echo "sign=false" >> "$GITHUB_OUTPUT"
          fi

      # Signing runs only: restore the keystore so the single build below signs
      # the release APK. Other runs leave HOME_KEYSTORE_FILE unset and get an
      # unsigned APK, which is fine because nothing is published.
      - name: Restore signing keystore
        if: steps.gate.outputs.sign == 'true'
        env:
          KEYSTORE: ${{ secrets.HOME_KEYSTORE_BASE64 }}
        run: |
          (umask 077 && echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/home.jks")
          echo "HOME_KEYSTORE_FILE=$RUNNER_TEMP/home.jks" >> "$GITHUB_ENV"

      # The signing env is empty unless the gate passed (Gradle ignores it
      # without HOME_KEYSTORE_FILE).
      - name: Test, lint and build
        env:
          HOME_KEYSTORE_PASSWORD: ${{ steps.gate.outputs.sign == 'true' && secrets.HOME_KEYSTORE_PASSWORD || '' }}
          HOME_KEY_ALIAS: ${{ steps.gate.outputs.sign == 'true' && secrets.HOME_KEY_ALIAS || '' }}
          HOME_KEY_PASSWORD: ${{ steps.gate.outputs.sign == 'true' && secrets.HOME_KEY_PASSWORD || '' }}
        run: ./gradlew testDebugUnitTest lint assembleRelease

      - name: Stage signed APK
        if: steps.gate.outputs.sign == 'true'
        run: |
          # The signed APK's file name depends on AGP; require exactly one.
          mapfile -t apks < <(find app/build/outputs/apk/release -name '*.apk')
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "Expected exactly one release APK, found ${#apks[@]}" >&2
            exit 1
          fi
          cp "${apks[0]}" home.apk

      - name: Upload signed APK
        if: steps.gate.outputs.sign == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: home-apk
          path: apps/android/home.apk
          if-no-files-found: error
          retention-days: 1

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/home.jks"

  publish:
    needs: build
    if: github.event_name == 'push' && needs.build.outputs.sign == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: home-apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION_CODE: ${{ needs.build.outputs.version-code }}
        run: |
          gh release create "android-v$VERSION_CODE" home.apk \
            --title "Android $VERSION_CODE" \
            --notes "Built from commit $GITHUB_SHA" \
            --target "$GITHUB_SHA"
